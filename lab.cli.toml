# Subscription CLIs take prompts on stdin.
[run]
db = "runs/lab.sqlite"
concurrency = 2
cli_processes = 2
timeout_seconds = 180
max_calls = 90
max_output_tokens = 1000000
seed = 7
lead = "claude"

[providers.claude]
kind = "command"
command = ["claude", "-p", "--output-format", "json", "--tools", "", "--no-session-persistence"]

[providers.codex]
kind = "command"
command = ["codex", "exec", "--ephemeral", "-s", "read-only", "--skip-git-repo-check", "--ignore-user-config", "--color", "never", "-o", "{out}", "-"]

[providers.gemini]
kind = "command"
command = ["gemini", "-p", "Answer the request supplied on stdin. Do not use tools.", "--output-format", "json"]
