# Subscription CLIs take prompts on stdin.
[runner]
active_labs = ["claude", "codex"]
db = "runs/lab.sqlite"
concurrency = 2
cli_processes = 2
timeout_seconds = 180
max_calls = 90
max_output_tokens = 1000000
seed = 7
lead = "claude"

[labs.claude]
kind = "command"
command = ["claude", "-p", "--output-format", "json"]

[labs.codex]
kind = "command"
command = ["codex", "exec", "--ephemeral", "-s", "read-only"]

[labs.gemini]
mode = "chat_bridge"
